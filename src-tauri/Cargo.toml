[package]
name = "maedit_v1"
version = "1.0.0"
description = "MaEdit V1 desktop creative editor"
authors = ["MaEdit"]
edition = "2021"

[lib]
name = "maedit_v1_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
